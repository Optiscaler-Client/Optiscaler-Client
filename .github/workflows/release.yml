name: Release

on:
  push:
    branches: [main, pre-release]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
      should_release: ${{ steps.gate.outputs.should_release }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for version bump
        id: gate
        run: |
          VERSION="$(grep -oPm1 '(?<=<Version>)[^<]+' OptiscalerClient.csproj)"

          if [ "${{ github.ref_name }}" = "pre-release" ]; then
            SUFFIX="-pre"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            SUFFIX=""
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          TAG="OptiscalerClient-$VERSION$SUFFIX"
          LATEST_TAG="$(git tag -l "OptiscalerClient-*$SUFFIX" | grep -E "^OptiscalerClient-[0-9]+(\.[0-9]+)*$SUFFIX\$" | sort -V | tail -n1)"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          if [ "$TAG" = "$LATEST_TAG" ]; then
            echo "No version bump ($TAG already tagged) — skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version bump detected: ${LATEST_TAG:-<none>} -> $TAG"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog block
        if: steps.gate.outputs.should_release == 'true'
        run: |
          VERSION="${{ steps.gate.outputs.version }}"
          MARKER="#### [$VERSION] ####"
          if ! grep -qxF "$MARKER" CHANGELOG.md; then
            echo "::error::Falta el changelog de la version $VERSION. Agrega un bloque '$MARKER' a CHANGELOG.md (con # What's Changed y # Changelog) antes de mergear el bump."
            exit 1
          fi
          awk -v m="$MARKER" '
            $0 == m { found=1; next }
            found && /^#### \[/ { exit }
            found { print }
          ' CHANGELOG.md > changelog_block.txt

          if ! grep -qx '# Changelog' changelog_block.txt; then
            echo "::error::El bloque de $VERSION en CHANGELOG.md no tiene una linea '# Changelog' donde insertar el bloque de soporte."
            exit 1
          fi

          awk '
            $0 == "#### [SUPPORT] ####" { found=1; next }
            found { print }
          ' CHANGELOG.md > support_block.txt

      - name: Assemble release body
        if: steps.gate.outputs.should_release == 'true'
        run: |
          awk '
            /^# Changelog$/ {
              while ((getline line < "support_block.txt") > 0) print line
              print ""
            }
            { print }
          ' changelog_block.txt > release_body.md

          if [ -n "${{ steps.gate.outputs.prev_tag }}" ]; then
            {
              echo
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.gate.outputs.prev_tag }}...${{ steps.gate.outputs.tag }}"
            } >> release_body.md
          fi

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.should_release == 'true'
        with:
          name: release-notes
          path: release_body.md

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish win-x64
        run: dotnet publish OptiscalerClient.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/win-x64

      - name: Publish linux-x64
        run: dotnet publish OptiscalerClient.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o dist/linux-x64

      - name: Publish linux-arm64
        run: dotnet publish OptiscalerClient.csproj -c Release -r linux-arm64 --self-contained true -p:PublishSingleFile=true -o dist/linux-arm64

      - name: Build AppImage
        run: bash packaging/appimage/build.sh

      - name: Package artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ( cd dist/win-x64 && zip -r "../OptiscalerClient-$VERSION-win-x64.zip" . )
          ( cd dist/linux-x64 && zip -r "../OptiscalerClient-$VERSION-linux-x64.zip" . && tar -czf "../OptiscalerClient-$VERSION-linux-x64.tar.gz" . )
          ( cd dist/linux-arm64 && zip -r "../OptiscalerClient-$VERSION-linux-arm64.zip" . && tar -czf "../OptiscalerClient-$VERSION-linux-arm64.tar.gz" . )
          mv "OptiscalerClient-$VERSION-x86_64.AppImage" dist/
          chmod +x "dist/OptiscalerClient-$VERSION-x86_64.AppImage"
          rm -rf dist/win-x64 dist/linux-x64 dist/linux-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  nix-build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v14
        with:
          name: optiscaler-client
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      # nix-deps.json is a committed lockfile generated via passthru.fetch-deps, which
      # excludes the NuGet packages the .NET SDK derivation already provides. Regenerating it
      # here with a plain `dotnet restore` reintroduces them (SelfContained=true pulls
      # Microsoft.NETCore.App.Runtime.linux-x64) and configureNuget then fails linking a
      # duplicate into the fallback folder. nix-build.yml validates the committed file.
      - run: nix build .#default -L

  flatpak-build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install flatpak-builder and runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder imagemagick
          # --user: the runner has no polkit session, so system-wide flatpak operations
          # are refused with "ConfigureRemote not allowed for user".
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Build flatpak bundle
        run: bash packaging/flatpak/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: OptiscalerClient-*-x86_64.flatpak

  release:
    needs: [prepare, build, nix-build, flatpak-build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: flatpak
          path: dist

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" dist/* --title "$TAG" --notes-file release_body.md "${FLAGS[@]}"
